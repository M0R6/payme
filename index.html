<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morgan's QRIS</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #1e293b 0%, #334155 100%);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 340px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 20px;
    color: #1e293b;
  }
  .qr-frame {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
  }
  .qr-frame img {
    width: 100%;
    display: block;
    border-radius: 4px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #334155;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #1e293b; }
</style>
</head>
<body>

<div class="card">
  <h1>Morgan's QRIS</h1>
  <div class="qr-frame">
    <img id="qrImage" src="MorganQRIS.jpg">
  </div>
  <button onclick="downloadQR()">Simpan QR</button>
</div>

<script>
  function downloadQR() {
    const link = document.createElement('a');
    link.href = document.getElementById('qrImage').src;
    link.download = 'MorganQRIS.jpg';
    link.click();
  }
</script>

</body>
</html>
