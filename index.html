<style>
  * { box-sizing: border-box; }
  body {

    background: linear-gradient(160deg, #1e293b 0%, #334155 100%);

  }

    background: #fff;
    border-radius: 24px;

    width: 90%;
    text-align: center;

    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
  }
  .qr-frame img {
    width: 100%;
    display: block;
    border-radius: 4px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #334155;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #1e293b; }
</style>
